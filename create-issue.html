<script type="text/javascript">
  RED.nodes.registerType("jira-create-issue", {

    color: "#4a698a",
    icon: "jira.svg",
    defaults: {
      name: { value: null },
      server: { value: "", type: "jira-server", required: true },
      project: { value: "", required: true },
      summary: { value: "", required: true },

<script type="text/html" data-help-name="jira-create-issue">
  <h3>Description</h3>
  <p>
    This node allows you to create a new Jira issue in a simple and intuitive
    way. Just fill in the basic fields, you do not need to provide the entire
    JSON object.
  </p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>msg.project <span class="property-type">string</span></dt>
    <dd>
      Project key, e.g. <code>PROJ</code>. If not set in the message, the value
      from the node configuration will be used.
    </dd>

    <dt>msg.summary <span class="property-type">string</span></dt>
    <dd>Issue summary (title).</dd>

    <dt class="optional">
      msg.description <span class="property-type">string</span>
    </dt>
    <dd>Issue description.</dd>

    <dt class="optional">
      msg.issuetype <span class="property-type">string</span>
    </dt>
    <dd>
      Issue type, e.g. <code>Task</code>, <code>Bug</code>, <code>Story</code>.
    </dd>

    <dt class="optional">
      msg.labels <span class="property-type">string</span>
    </dt>
    <dd>Labels, comma separated (e.g. <code>frontend,urgent</code>).</dd>

    <dt class="optional">
      msg.components <span class="property-type">string</span>
    </dt>
    <dd>Components, comma separated (e.g. <code>API,UI</code>).</dd>

    <dt class="optional">
      msg.fields <span class="property-type">object | string</span>
    </dt>
    <dd>Advanced settings – a JSON object that overrides the basic fields.</dd>

    <dt class="optional">
      msg.properties <span class="property-type">object | string</span>
    </dt>
    <dd>Issue properties.</dd>

    <dt class="optional">
      msg.update <span class="property-type">object | string</span>
    </dt>
    <dd>Mapping of fields and operations to perform on the issue.</dd>

    <dt class="optional">
      msg.historyMetadata <span class="property-type">object | string</span>
    </dt>
    <dd>Additional issue history details.</dd>
  </dl>

  <h3>Outputs</h3>
  <ol class="node-ports">
    <li>
      Success
      <dl class="message-properties">
        <dt>msg.payload <span class="property-type">object</span></dt>
        <dd>The created Jira issue.</dd>
      </dl>
    </li>
    <li>
      Error
      <dl class="message-properties">
        <dt>msg.error <span class="property-type">string</span></dt>
        <dd>Error description, if any occurred.</dd>
      </dl>
    </li>
  </ol>

  <h3>Example usage</h3>
  <pre>
{
  "project": "PROJ",
  "summary": "New issue from Node-RED",
  "description": "Issue description",
  "issuetype": "Task",
  "labels": "frontend,urgent",
  "components": "API,UI"
}
  </pre
  >

  <h3>API Reference</h3>
  <a
    href="https://developer.atlassian.com/cloud/jira/platform/rest/v2/api-group-issues/#api-rest-api-2-issue-post"
    target="_blank"
  >
    Jira REST API: Create Issue
  </a>
</script>
